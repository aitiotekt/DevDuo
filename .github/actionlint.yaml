# GitHub's hosted macOS 27 preview is not in actionlint 1.7.12's built-in labels.
# Verified at https://github.com/actions/runner-images#available-images.
self-hosted-runner:
  labels:
    - xcode-27

# GitHub supports a 100-run pending queue, but actionlint 1.7.12 lacks its schema.
# Remove these exact, path-scoped exceptions when actionlint supports the syntax.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
paths:
  .github/workflows/release.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/webkit-release.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
