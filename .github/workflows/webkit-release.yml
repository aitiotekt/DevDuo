name: WebKit runtime release

on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true
      application-release:
        type: boolean
        default: false
    outputs:
      built:
        description: Whether this run needed to build a runtime artifact
        value: ${{ jobs.plan.outputs.required }}
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify artifacts without creating tags or publishing a Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: devduo-webkit-release
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      runner_labels: ${{ steps.plan.outputs.runner_labels }}
      stem: ${{ steps.plan.outputs.stem }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-only: 'true'
      - name: Validate release ref and check published runtime availability
        id: plan
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          WEBKIT_APPLICATION_RELEASE: ${{ inputs.application-release || false }}
          GH_TOKEN: ${{ github.token }}
        run: mise exec node pnpm just gh -- just plan-webkit-release

  build:
    needs: plan
    if: needs.plan.outputs.required == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_labels) }}
    # Keep the complete job below GITHUB_TOKEN's 24-hour lifetime.
    timeout-minutes: 1380
    defaults:
      run:
        shell: powershell
    steps:
      - name: Require real symlinks
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          # The persistent Ninja, source and vcpkg caches live in ignored temp/.
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-only: 'true'
      - name: Verify runtime packaging and persistent source recovery
        run: mise exec -- just test-webkit-release-tools
      - name: Detect the preserved version package
        id: package
        run: |
          $archive = 'temp/release/webkit/${{ needs.plan.outputs.stem }}/${{ needs.plan.outputs.stem }}.zip'
          "reuse=$((Test-Path -LiteralPath $archive -PathType Leaf).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Install locked portable engine tools
        if: steps.package.outputs.reuse != 'true'
        run: mise --env windows-webkit install
      - name: Build the pinned engine with native touch and asynchronous scrolling
        if: steps.package.outputs.reuse != 'true'
        timeout-minutes: 1320
        run: mise --env windows-webkit exec -- just build-windows-webkit-runtime
      - name: Validate capabilities and package the runtime (including reused archives)
        run: mise exec -- just package-webkit-release
      - uses: actions/upload-artifact@v7
        with:
          name: webkit-runtime-release
          path: temp/release/webkit/${{ needs.plan.outputs.stem }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.dry_run == 'false' && needs.plan.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          tooling-only: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: webkit-runtime-release
          path: temp/release/webkit/${{ needs.plan.outputs.stem }}/
      - name: Publish without replacing existing assets or the app's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          WEBKIT_APPLICATION_RELEASE: ${{ inputs.application-release || false }}
        run: mise exec node pnpm just gh -- just publish-webkit-release
