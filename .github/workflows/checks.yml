name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          docs-only: 'true'
      - name: Resolve platform matrix from metadata
        id: plan
        run: mise exec node pnpm just -- node scripts/release.mts checks-matrix

  portable:
    name: Tooling (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require real Windows symlinks before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Check docs, Python, JavaScript and localization harness
        run: mise exec -- just check
      - run: mise exec -- just lint
      - run: mise exec -- just typecheck
      - run: mise exec -- just release-check
      - name: Build documentation
        if: runner.os == 'macOS'
        run: mise exec -- just build-docs
      - name: Compile native target
        if: runner.os != 'Linux'
        run: mise exec -- just build

  report:
    name: Checks report
    if: always()
    needs: [plan, portable]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT: ${{ needs.portable.result }}
        run: |
          test "${PLAN_RESULT}" = success
          test "${RESULT}" = success
