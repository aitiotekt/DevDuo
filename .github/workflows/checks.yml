name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require real Windows symlinks before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Check docs, Python, JavaScript and localization harness
        run: mise exec -- just check
      - run: mise exec -- just lint
      - run: mise exec -- just typecheck
      - name: Compile Windows target
        if: runner.os == 'Windows'
        run: mise exec -- just build
