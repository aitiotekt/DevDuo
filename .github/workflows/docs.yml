name: Documentation

on:
  push:
    branches: [main, release]
    paths:
      - '**.md'
      - docs/**
      - docsite/**
      - scripts/docs.mts
      - scripts/lib/docs.mts
      - scripts/lib/metadata.mts
      - scripts/lib/paths.mts
      - scripts/docs-manifest.json
      - scripts/python/**
      - pyproject.toml
      - uv.lock
      - package.json
      - devduo-metadata.toml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - mise.toml
      - mise.lock
      - justfile
      - justfiles/**
      - .github/actions/setup-workspace/action.yml
      - .github/workflows/docs.yml
  # PR documentation is built by Checks; this workflow packages deployment inputs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          docs-only: 'true'
      - name: Audit publication inputs before packaging the site
        run: |
          mise install python uv
          mise exec python uv node pnpm just -- just setup-python public-audit
      - run: mise exec node pnpm just -- just docs-check
      - run: mise exec node pnpm just -- just build-docs
      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          name: devduo-docsite
          path: temp/build/docsite/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: temp/build/docsite/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
