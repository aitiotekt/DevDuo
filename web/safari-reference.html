<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>DevDuo Reference A</title>
    <style>
      :root { font-family: -apple-system, sans-serif; color-scheme: light dark; --paper: #eef3f8; --ink: #17283b; --card: #fff; }
      @media (prefers-color-scheme: dark) { :root { --paper: #101923; --ink: #edf4ff; --card: #253345; } }
      :root[data-palette="light"] { --paper: #eef3f8; --ink: #17283b; --card: #fff; }
      :root[data-palette="dark"] { --paper: #101923; --ink: #edf4ff; --card: #253345; }
      * { box-sizing: border-box; }
      html { background: var(--paper); color: var(--ink); }
      body { margin: 0; }
      nav { position: sticky; top: 0; z-index: 1; padding: 8px; background: var(--card); border-bottom: 2px solid #3980e5; }
      button { font: 13px -apple-system, sans-serif; padding: 8px; margin: 2px; }
      output { display: block; font: 11px monospace; margin: 4px; }
      header, section { padding: 24px; }
      h1 { font-size: 30px; margin: 12px 0; }
      p { line-height: 1.6; }
      .swatches { display: flex; height: 64px; }
      .swatches i { flex: 1; background: #ff6978; }
      .swatches i:nth-child(2) { background: #35cfa6; }
      .swatches i:nth-child(3) { background: #498cff; }
      .swatches i:nth-child(4) { background: #9469d9; }
      section { min-height: 400px; border-top: 1px solid #7d91a455; }
      .card { padding: 20px; background: var(--card); border: 1px solid #7d91a455; border-radius: 18px; }
      .ruler { height: 40px; background: repeating-linear-gradient(90deg, #3980e5 0 1px, transparent 1px 20px); }
    </style>
  </head>
  <body>
    <nav aria-label="Fixture controls">
      <button data-scroll="top">Top</button><button data-scroll="down">Down 400</button><button data-scroll="up">Up 120</button>
      <button data-palette="auto">Auto</button><button data-palette="light">Light</button><button data-palette="dark">Dark</button>
      <output id="metrics"></output>
    </nav>
    <header>
      <small>CONTROLLED LOCAL FIXTURE · CSS PX</small>
      <h1>DevDuo Reference A</h1>
      <p>Page content is upright in its own coordinate system. Safari chrome and the device body are separate reference frames.</p>
      <div class="swatches"><i></i><i></i><i></i><i></i></div>
    </header>
    <main></main>
    <script>
      const parameters = new URLSearchParams(location.search);
      const themeColor = parameters.get('themeColor');
      if (themeColor) {
        if (!CSS.supports('color', themeColor)) throw new Error('Invalid themeColor');
        const meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = themeColor;
        document.head.append(meta);
      }
      const label = parameters.get('tab') === 'B' ? 'B' : 'A';
      document.title = `DevDuo Reference ${label}`;
      document.querySelector('h1').textContent = document.title;
      let palette = parameters.get('palette') || 'auto';
      let previousY = scrollY;
      let lastDirection = 'none';
      let pending;
      for (let index = 0; index < 10; index++) {
        const section = document.createElement('section');
        section.innerHTML = `<small>FLOW SECTION ${index + 1} · Y increases downward ↓</small><h2>Web content +Y ↓ / +X →</h2><div class="card"><p>Ordinary document flow. Scroll down to compact Safari; reverse upward to expand it.</p><div class="ruler"></div><p>No fixed footer, injected safe-area padding or simulated browser widgets.</p></div>`;
        document.querySelector('main').append(section);
      }
      function setPalette(value) {
        if (!['auto', 'light', 'dark'].includes(value)) throw new Error('Unknown palette');
        palette = value;
        document.documentElement.dataset.palette = value;
        report('palette');
      }
      function report(reason) {
        clearTimeout(pending);
        const record = {
          schemaVersion: 1, recordType: 'safari-reference-fixture', clientTimestamp: new Date().toISOString(), reason,
          labels: { tab: label, palette, direction: lastDirection },
          viewport: { innerWidth, innerHeight, scrollY, documentHeight: document.documentElement.scrollHeight,
            screenWidth: screen.width, screenHeight: screen.height, devicePixelRatio,
            orientationType: screen.orientation?.type, orientationAngle: screen.orientation?.angle,
            visualWidth: visualViewport?.width, visualHeight: visualViewport?.height,
            visualOffsetTop: visualViewport?.offsetTop, visualScale: visualViewport?.scale },
          environment: { colorScheme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
            pageBackground: getComputedStyle(document.documentElement).backgroundColor, themeColor },
        };
        document.getElementById('metrics').textContent = `${label} · ${record.environment.colorScheme} / ${palette} · ${innerWidth}×${innerHeight} · Y ${scrollY} · ${lastDirection}`;
        window.devduoReferenceObservation = record;
        fetch('/api/measurements', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(record) });
      }
      document.querySelectorAll('[data-palette]').forEach(button => button.onclick = () => setPalette(button.dataset.palette));
      document.querySelectorAll('[data-scroll]').forEach(button => button.onclick = () => {
        const action = button.dataset.scroll;
        if (action === 'top') scrollTo(0, 0);
        else scrollBy(0, action === 'down' ? 400 : -120);
      });
      addEventListener('scroll', () => {
        if (scrollY !== previousY) lastDirection = scrollY > previousY ? 'down' : 'up';
        previousY = scrollY;
        pending = setTimeout(() => report('scroll'), 150);
      }, { passive: true });
      addEventListener('resize', () => { pending = setTimeout(() => report('resize'), 150); });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => report('appearance'));
      setPalette(palette);
    </script>
  </body>
</html>
