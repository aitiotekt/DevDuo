<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop input acceptance</title>
<style>
  html { background: #b9e4dc; color: #13251f; }
  body { margin: 0; padding: 16px; font: 16px/1.4 sans-serif; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  label { display: block; margin: 8px 0 3px; }
  input, textarea, select, button, [contenteditable] { box-sizing: border-box; font: inherit; }
  input, textarea, select, [contenteditable] { width: 100%; padding: 6px; border: 1px solid #50796d; background: white; color: #13251f; }
  [contenteditable] { min-height: 36px; }
  button { padding: 6px; margin: 6px 4px 0 0; }
  dialog { width: 240px; border: 2px solid #1c6c59; border-radius: 14px; }
  dialog::backdrop { background: #10271f66; }
  main { min-height: 1100px; background: linear-gradient(transparent, #e9b8e3); }
  :focus-visible { outline: 3px solid #1746d8; outline-offset: 2px; }
</style>
<main>
  <h1>Desktop input acceptance</h1>
  <label for="text">Composition text</label><input id="text" autocomplete="off">
  <label for="multiline">Multiline text</label><textarea id="multiline" rows="2"></textarea>
  <label for="editable">Editable paragraph</label><div id="editable" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="editable-label"></div>
  <span id="editable-label" hidden>Editable paragraph</span>
  <label for="choice">Native choice</label><select id="choice"><option>First option</option><option>Second option</option><option>Third option</option></select>
  <button id="modal">Show modal dialog</button><button id="alert">JavaScript alert</button>
  <button id="confirm">JavaScript confirm</button><button id="prompt">JavaScript prompt</button>
  <p><a href="standards.html">Ordinary navigation link</a></p>
  <output id="result" aria-live="polite">No dialog result</output>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog">
  <h2 id="dialog-title">Modal acceptance</h2>
  <label for="dialog-text">Dialog text</label><input id="dialog-text">
  <button value="accepted">Accept dialog</button><button value="cancelled">Cancel dialog</button>
</form></dialog>
<script>
  const events = [];
  window.resetInputAcceptance = () => { events.length = 0; };
  for (const name of ['keydown', 'keyup', 'compositionstart', 'compositionupdate', 'compositionend', 'beforeinput', 'input', 'focusin', 'focusout', 'change']) {
    document.addEventListener(name, event => {
      events.push({ type: event.type, target: event.target.id, data: event.data ?? null,
        inputType: event.inputType ?? null, composing: event.isComposing ?? null, key: event.key ?? null, alt: event.altKey ?? null });
      if (events.length > 200) events.shift();
    });
  }
  const result = document.querySelector('#result');
  const dialog = document.querySelector('#dialog');
  document.querySelector('#modal').onclick = () => dialog.showModal();
  dialog.onclose = () => { result.textContent = 'Modal: ' + dialog.returnValue; };
  document.querySelector('#alert').onclick = () => { alert('Native alert acceptance'); result.textContent = 'Alert returned'; };
  document.querySelector('#confirm').onclick = () => { result.textContent = 'Confirm: ' + confirm('Native confirm acceptance'); };
  document.querySelector('#prompt').onclick = () => { result.textContent = 'Prompt: ' + prompt('Native prompt acceptance', 'initial'); };
  window.inputAcceptanceState = () => ({
    events: [...events], text: document.querySelector('#text').value,
    multiline: document.querySelector('#multiline').value, editable: document.querySelector('#editable').textContent,
    choice: document.querySelector('#choice').selectedIndex, dialogOpen: dialog.open,
    dialogText: document.querySelector('#dialog-text').value, result: result.textContent,
    active: document.activeElement?.id, selection: getSelection()?.toString(), timeOrigin: performance.timeOrigin
  });
</script>
</html>
