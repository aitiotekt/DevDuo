<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standards layout acceptance</title>
<style>
  html { background: #18b9a8; scrollbar-width: none; }
  body { margin: 0; font: 16px/24px sans-serif; }
  main { height: 2400px; background: repeating-linear-gradient(#89dc64 0 39px, #08af9d 40px 79px); }
  header { position: sticky; top: 0; height: 40px; background: #ffe36c; }
  footer { position: fixed; bottom: 0; left: 0; width: 180px; height: 20px; background: #ff00ff; }
  aside { position: fixed; right: 5px; top: 5px; background: white; }
  #animation { position: absolute; top: 610px; left: 8px; white-space: nowrap; }
  .unit { position: absolute; width: 0; top: 0; pointer-events: none; }
</style>
<main><header>Native scrolling / sticky header</header><h1>Ordinary standards page</h1>
  <p>No probeMetrics function or viewport overrides.</p><input aria-label="Input acceptance" placeholder="Type here">
  <p><a href="overflow.html">Navigate to horizontal overflow</a></p>
  <div id="animation">Live animation</div>
</main>
<footer>Fixed bottom</footer><aside>Fixed top / right</aside>
<div class="unit" data-unit="vh" style="height:100vh"></div>
<div class="unit" data-unit="svh" style="height:100svh"></div>
<div class="unit" data-unit="lvh" style="height:100lvh"></div>
<div class="unit" data-unit="dvh" style="height:100dvh"></div>
<script>
  let frames = 0;
  function animate() {
    const element = document.getElementById('animation');
    element.textContent = `LIVE ${++frames}`;
    element.style.background = `hsl(${frames * 3 % 360} 100% 65%)`;
    requestAnimationFrame(animate);
  }
  animate();
</script>
