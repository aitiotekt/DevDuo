<!doctype html>
<meta charset="utf-8">
<title>Nested modal sequence</title>
<style>
  html { background: rgb(240, 240, 240); }
  body { margin: 0; min-height: 4000px; }
  #flow { height: 4000px; background: linear-gradient(#f0f0f0, #4080c0); }
  .overlay { position: fixed; inset: 0; background: rgb(40, 80, 160); z-index: 10; }
  .transparent { background: transparent; }
  .paint { position: absolute; inset: 0; background: rgb(40, 80, 160); }
  .partial { left: 40%; }
  dialog { border: 0; }
  dialog::backdrop { background: rgb(40, 80, 160); }
</style>
<div id="flow"></div><div id="mount"></div>
<script>
  const mount = document.querySelector('#mount');
  window.setModal = (mode, color = 'rgb(40,80,160)') => {
    mount.replaceChildren();
    mount.removeAttribute('style');
    document.querySelector('#flow').style.background = '';
    if (mode === 'none') return mode;
    let parent = mount;
    for (let depth = 0; depth < 32; depth++) {
      const wrapper = document.createElement('div');
      parent.append(wrapper);
      parent = wrapper;
    }
    if (mode === 'transform' || mode === 'filter' || mode === 'contain') {
      mount.style.cssText = 'position:fixed;left:80px;top:100px;width:160px;height:180px;';
      mount.style[mode] = mode === 'transform' ? 'translateZ(0)' : mode === 'filter' ? 'blur(0px)' : 'paint';
    }
    if (mode === 'shadow') parent = parent.attachShadow({ mode: 'open' });
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.cssText = `position:fixed;inset:0;z-index:10;background:${color}`;
    if (mode === 'pointer-none') overlay.style.pointerEvents = 'none';
    if (mode === 'partial') overlay.style.left = '40%';
    if (mode === 'opacity') {
      parent.style.opacity = '.5';
      document.querySelector('#flow').style.background = 'rgb(240,240,240)';
    }
    if (mode === 'transparent-wrapper' || mode === 'image') {
      overlay.style.background = 'transparent';
      const child = document.createElement(mode === 'image' ? 'img' : 'div');
      child.style.cssText = `position:absolute;inset:0;width:100%;height:100%;background:${color}`;
      if (mode === 'image') {
        child.style.background = 'transparent';
        child.src = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="2" height="2" viewBox="0 0 2 2" preserveAspectRatio="none"><path fill="${color}" d="M0 0h2v2H0z"/></svg>`);
      }
      overlay.append(child);
    }
    if (mode === 'mixed') overlay.style.background = 'linear-gradient(90deg,red,blue)';
    if (mode === 'iframe') {
      overlay.style.background = 'transparent';
      const child = document.createElement('iframe');
      child.style.cssText = 'position:absolute;inset:0;border:0;width:100%;height:100%';
      child.srcdoc = `<style>html,body{margin:0;background:${color}}div{position:fixed;inset:0;background:${color}}</style><div></div>`;
      overlay.append(child);
    }
    if (mode === 'dialog') {
      const dialog = document.createElement('dialog');
      dialog.textContent = 'Native dialog';
      parent.append(dialog);
      dialog.showModal();
    } else parent.append(overlay);
    return mode;
  };
  window.modalIdentity = () => JSON.stringify({
    document: performance.timeOrigin, viewport: [innerWidth, innerHeight], scroll: [scrollX, scrollY],
    range: [document.scrollingElement.scrollWidth, document.scrollingElement.scrollHeight]
  });
  window.swapModal = () => {
    setModal('none');
    setTimeout(() => setModal('transparent-wrapper', 'rgb(160,80,40)'), 60);
    return 'swapping';
  };
  window.crossfadeModal = () => {
    setModal('deep');
    const next = document.createElement('div');
    next.style.cssText = 'position:fixed;inset:0;z-index:20;background:rgb(160,80,40)';
    mount.append(next);
    next.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240 }).finished.then(() => {
      setModal('deep', 'rgb(160,80,40)');
    });
    return 'crossfading';
  };
</script>
