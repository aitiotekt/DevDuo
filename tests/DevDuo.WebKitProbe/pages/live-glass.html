<!doctype html>
<meta charset="utf-8">
<meta name="theme-color" content="#e8edf5">
<title>Live glass composition acceptance</title>
<style>
  html { background: #e8edf5; }
  body { margin: 0; color: #172033; font: 20px/1.5 sans-serif; }
  main { height: 2400px; background: repeating-linear-gradient(90deg, #ff7171 0 10px, #72ddff 10px 20px); }
  h1, p { margin: 0; padding: 25px; background: #ffffffbb; }
  #animation { position: absolute; top: 610px; left: 10px; font: bold 32px monospace; }
  #tile { position: absolute; top: 600px; width: 180px; height: 60px; background: #fff000; animation: slide 2s linear infinite alternate; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(190px); } }
</style>
<main><h1>Live native surface and local background blur</h1>
  <p>The animated tile and counter cross below the real 580px layout viewport. No fixed elements.</p>
  <button onclick="document.querySelector('#tile').style.animationPlayState='paused';window.cancelAnimationFrame(frame)">Pause animation</button>
  <div id="tile"></div><div id="animation"></div>
</main>
<script>
  let ticks = 0, frame;
  function animate() {
    document.querySelector('#animation').textContent = `LIVE ${++ticks}`;
    frame = requestAnimationFrame(animate);
  }
  animate();
</script>
