<!doctype html>

<title>Native content edge color acceptance</title>
<style>
  html { background: white; }
  body { margin: 0; font: 18px sans-serif; }
  header { height: 80px; background: white; display: flex; align-items: flex-end; }
  section { height: 800px; }
  #solid { background: #2468ac; }
  #gradient { background: linear-gradient(90deg, #204060, #6080a0); }

</style>
<header>Actual rendered color: solid, gradient, SVG image and transparent canvas.</header>
<section id="solid"></section>
<section id="gradient"></section>
<section id="image"></section>
<section id="transparent"></section>
