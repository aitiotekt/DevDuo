<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame continuation fixture</title>
<style>
  html { background: #eef3f8; }
  body { margin: 0; min-height: 500vh; }
  #edge { position: fixed; inset: 0; pointer-events: none; background: rgb(64, 96, 128); }
</style>
<div id="edge"></div>
<script>
  const accelerated = false;
  const edge = document.getElementById('edge');
  if (accelerated) edge.style.willChange = 'transform';
  let frame = 0;
  function advance() {
    if (window.pauseFixture) return;
    frame++;
    edge.style.backgroundColor = `rgb(${48 + frame % 128}, ${64 + (frame * 3) % 128}, ${80 + (frame * 7) % 128})`;
    requestAnimationFrame(advance);
  }
  requestAnimationFrame(advance);
</script>
</html>
