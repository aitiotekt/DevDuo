<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translated fixed footer</title>
<style>
  html, body { margin: 0; background: white; }
  main {
    width: calc(100% - 54px);
    height: 4000px;
    background: repeating-linear-gradient(#e9f3f9 0 53px, #fff 53px 104px);
    transform: translateZ(0);
  }
  footer {
    position: fixed;
    inset: auto 0 0;
    height: 102px;
    background: linear-gradient(to bottom, transparent, white 58%);
    transform: translate3d(0, 110%, 0);
    transition: transform 480ms linear;
  }
  footer.revealed { transform: translate3d(0, 0, 0); }
  button {
    position: absolute;
    inset: auto 12px 17px;
    height: 47px;
    border: 0;
    border-radius: 5px;
    color: white;
    background: #d71939;
  }
</style>
<main></main>
<footer><button type="button">Continue</button></footer>
<script>
  const footer = document.querySelector('footer');
  let scriptFrame;
  addEventListener('scroll', () => {
    const revealed = scrollY > 420;
    if (!window.footerTestUseScript) {
      footer.classList.toggle('revealed', revealed);
      return;
    }
    if (footer.classList.contains('revealed') === revealed) return;
    const from = new DOMMatrixReadOnly(getComputedStyle(footer).transform).m42;
    const target = revealed ? 0 : footer.offsetHeight * 1.1;
    footer.style.transition = 'none';
    footer.style.transform = `translateY(${from}px)`;
    footer.classList.toggle('revealed', revealed);
    cancelAnimationFrame(scriptFrame);
    const started = performance.now();
    function move(timestamp) {
      const progress = Math.max(0, Math.min(1, (timestamp - started) / 480));
      footer.style.transform = `translateY(${from + (target - from) * progress}px)`;
      if (progress < 1) scriptFrame = requestAnimationFrame(move);
    }
    scriptFrame = requestAnimationFrame(move);
  });
  window.footerTestState = () => {
    const rect = footer.getBoundingClientRect();
    const button = footer.firstElementChild.getBoundingClientRect();
    return { y: scrollY, height: innerHeight, width: innerWidth, top: rect.top,
      bottom: rect.bottom, buttonTop: button.top, buttonBottom: button.bottom,
      revealed: footer.classList.contains('revealed') };
  };
</script>
