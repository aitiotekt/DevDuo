[settings]
# Keep selected tools ahead of unrelated global installations in child processes.
activate_aggressive = true

# mise selects compatible tool lines; just owns repository tasks.
[tools]
dotnet = "10"
python = "3.14"
uv = "latest"
node = "26"
pnpm = "12"
just = "latest"
gh = "latest"
actionlint = "latest"
prek = "latest"

[env]
UV_PYTHON_DOWNLOADS = "never"
PYTHONUTF8 = "1"
