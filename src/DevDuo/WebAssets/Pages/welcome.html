<!doctype html>
<html lang="__DEVDUO_LANGUAGE__" data-devduo-page="welcome-v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevDuo</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; background: #f5f7fb; color: #182335; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 24px; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 30px; line-height: 1.2; margin: 12px 0 20px; }
    p { margin: 0 0 18px; }
    .brand { color: #4568bc; font-weight: 650; letter-spacing: .03em; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
    a { color: #2459b8; padding: 8px 14px; border: 1px solid #bdcce5; border-radius: 10px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 3px solid #5279dc; outline-offset: 3px; }
    .note { font-size: 14px; color: #526178; }
    @media (prefers-color-scheme: dark) {
      :root { background: #182031; color: #e8edf7; }
      .brand, a { color: #a9c6ff; }
      a { border-color: #536587; }
      .note { color: #b2bfd5; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">DevDuo</p>
    <h1 data-i18n="Welcome.Title"></h1>
    <p data-i18n="Welcome.Introduction"></p>
    <p data-i18n="Welcome.AddressHint"></p>
    <nav aria-label="DevDuo">
      <a href="__DEVDUO_DOCUMENTATION__" data-i18n="Welcome.Documentation"></a>
      <a href="__DEVDUO_REPOSITORY__" data-i18n="Welcome.Repository"></a>
    </nav>
    <p class="note" data-i18n="Welcome.Offline"></p>
  </main>
  <script>
    window.devduoLocalizeWelcome = (language, strings) => {
      const position = [scrollX, scrollY];
      document.documentElement.lang = language;
      for (const node of document.querySelectorAll('[data-i18n]'))
        node.textContent = strings[node.dataset.i18n] ?? node.dataset.i18n;
      document.title = strings['Welcome.PageTitle'];
      scrollTo(...position);
    };
    window.devduoLocalizeWelcome('__DEVDUO_LANGUAGE__', __DEVDUO_STRINGS__);
  </script>
</body>
</html>
